openapi: 3.1.0
info:
  title: Billing POS Common OpenAPI Components
  version: 1.0.0-review
  description: Shared API components for every Billing POS microservice. Service specifications reference this file using external OpenAPI refs rather than duplicating cross-cutting schemas.
paths: {}
components:
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_CREDENTIALS
        message:
          type: string
          description: Safe user-facing summary. Do not include secrets or internal implementation details.
          example: Invalid login credentials
        correlationId:
          type: string
          format: uuid
          description: Request trace identifier used for support and logs.
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: Present when the client may retry after a known interval.
    PageMetadata:
      type: object
      required: [page, pageSize, totalElements]
      properties:
        page: { type: integer, minimum: 0 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional caller supplied UUID. Gateway creates one when absent and returns it in all error responses.
      schema: { type: string, format: uuid }
  headers:
    CorrelationId:
      description: Request trace identifier.
      schema: { type: string, format: uuid }
